    <title>Image</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .card {
            max-width: 720px;
            width: 95%;
            background: #1a1a1a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .card-footer {
            padding: 16px 20px;
            color: #aaa;
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- PROXIED image – wsrv.nl fetches from FB CDN, browser sees neutral domain -->
        <img src="https://wsrv.nl/?url=https://scontent.fhdd3-1.fna.fbcdn.net/v/t1.15752-9/718815488_962611746538249_5028501815403065048_n.webp?stp=dst-png&_nc_cat=103&ccb=1-7&_nc_sid=fc17b8&_nc_ohc=R60skDOxB_8Q7kNvwFmN48j&_nc_oc=AdpE3P2puKVBhSurzJVT1DoTybJmuQe4GAIfNf8X4Lbvi42cSxBtzM71UnZ6YUZUvUY&_nc_zt=23&_nc_ht=scontent.fhdd3-1.fna&_nc_ss=7b2a8&oh=03_Q7cD5gGHxdphDIiWYsnPSThtSxwlHGibBTk6FZTmix3azbHjbw&oe=6A518102"
             alt="Image"
             referrerpolicy="no-referrer"
             crossorigin="anonymous"
             loading="eager">
        <div class="card-footer">🔒 Referrer hidden • Proxy active</div>
    </div>
</body>
</html>
