<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Post Mockup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Facebook Post Container -->
    <div class="fb-card">
        
        <!-- Header: Profile and Timestamp -->
        <div class="fb-header">
            <img src="https://yt3.ggpht.com/NLha1ZJYyicuE5epGQYXQ-HyX8Qf-6u5GdEGsCGeLYgGhSDNZjCS_CiQ8qPAKcZaOA6Y8mUET6pRchs=s1024-nd-v1" alt="Profile" class="profile-pic">
            <div class="user-details">
                <span class="user-name">Alex Mercer</span>
                <span class="post-time">Just now · 🌐</span>
            </div>
            <div class="more-options">•••</div>
        </div>

        <!-- Post Body Content -->
        <div class="fb-content">
            <p>Just deployed the new system update! Everything is running smoothly. 🚀 #coding #developer</p>
        </div>

        <!-- Fake Media Optional Placeholder -->
        <div class="fb-media-placeholder">
            <div class="code-snippet-box">
                <code>console.log("Hello, World!");</code>
            </div>
        </div>

        <!-- Engagement Metrics -->
        <div class="fb-metrics">
            <div class="reactions">
                <span class="reaction-icons">👍❤️😮</span>
                <span class="reaction-count">42</span>
            </div>
            <div class="comment-share-counts">
                <span>12 Comments</span> · <span>3 Shares</span>
            </div>
        </div>

        <!-- Action Ribbon -->
        <div class="fb-actions">
            <button class="action-btn">👍 Like</button>
            <button class="action-btn">💬 Comment</button>
            <button class="action-btn">↪️ Share</button>
        </div>

    </div>

</body>
</html>
